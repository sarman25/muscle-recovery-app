<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow-red" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FF0000" flood-opacity="0.95"/>
    </filter>
    <filter id="glow-orange" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFA500" flood-opacity="0.95"/>
    </filter>
    <filter id="glow-green" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00FF00" flood-opacity="0.95"/>
    </filter>
  </defs>
  <style>
    .muscle-path {
      transition: fill 0.4s ease, filter 0.4s ease;
    }
  </style>

  <!-- Задний фон / Базовый силуэт тела (не красится, цвет #1f1f23) -->
  <g id="body-base-front" fill="#1f1f23" stroke="#2c2c35" stroke-width="2">
    <!-- Голова -->
    <ellipse cx="150" cy="45" rx="18" ry="24"/>
    <!-- Шея -->
    <path d="M142 65 L142 80 L158 80 L158 65 Z"/>
    <!-- Кисти рук -->
    <circle cx="50" cy="250" r="8"/>
    <circle cx="250" cy="250" r="8"/>
    <!-- Стопы -->
    <path d="M112 450 L132 450 L128 465 L108 465 Z"/>
    <path d="M168 450 L188 450 L192 465 L172 465 Z"/>
  </g>

  <!-- Интерактивные мышцы (по умолчанию темно-серые #3a3a45, плавно перекрашиваются) -->
  <g id="muscles-front" stroke="#18181c" stroke-width="1.5">
    <!-- ГРУДЬ -->
    <path id="chest" fill="#3a3a45" d="M115 95 C130 92, 170 92, 185 95 C190 120, 175 138, 150 142 C125 138, 110 120, 115 95 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    
    <!-- ПРЕСС -->
    <path id="abs" fill="#3a3a45" d="M125 146 C140 144, 160 144, 175 146 L170 215 C160 220, 140 220, 130 215 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    
    <!-- ЛЕВАЯ СТОРОНА -->
    <path id="shoulders" fill="#3a3a45" d="M85 92 C98 88, 110 95, 108 115 C100 125, 85 122, 78 110 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="biceps" fill="#3a3a45" d="M74 118 C82 116, 90 122, 88 155 C78 160, 70 152, 68 132 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="forearms" fill="#3a3a45" d="M64 162 C72 162, 78 168, 74 225 C66 230, 54 218, 52 190 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="legs" fill="#3a3a45" d="M115 225 C135 222, 147 225, 146 335 C132 340, 118 332, 110 280 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="calves" fill="#3a3a45" d="M114 345 C126 345, 136 348, 132 435 C120 435, 110 420, 108 385 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>

    <!-- ПРАВАЯ СТОРОНА -->
    <path id="shoulders_r" fill="#3a3a45" d="M215 92 C202 88, 190 95, 192 115 C200 125, 215 122, 222 110 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="biceps_r" fill="#3a3a45" d="M226 118 C218 116, 210 122, 212 155 C222 160, 230 152, 232 132 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="forearms_r" fill="#3a3a45" d="M236 162 C228 162, 222 168, 226 225 C234 230, 246 218, 248 190 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="legs_r" fill="#3a3a45" d="M185 225 C165 222, 153 225, 154 335 C168 340, 182 332, 190 280 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
    <path id="calves_r" fill="#3a3a45" d="M186 345 C174 345, 164 348, 168 435 C180 435, 190 420, 192 385 Z" style="transition: fill 0.3s ease; cursor: pointer;"/>
  </g>
</svg>